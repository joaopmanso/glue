[package]
name = "glue-home"
version = "0.73.0"
description = "GLUE Home: your main computer, reachable from the GLUE website"
authors = ["joaopmanso"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-drag = "2"
tauri-plugin-notification = "2"
# The local link's tokens (ADR 0160: made in Rust since the service page is gone).
getrandom = "0.3"
serde_json = "1"
tiny_http = "0.12"
trash = "5"
lofty = "0.25"
ureq = "2"
# The website's socket for its background loads (ADR 0139), and the account's signaling room's (ADR 0158).
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# The native analysis engine (ADR 0147).
glue-audio = { path = "../../crates/glue-audio" }
# The connections to the account's other devices (ADR 0150).
glue-rtc = { path = "../../crates/glue-rtc" }
# The library store in Rust (ADR 0152).
glue-store = { path = "../../crates/glue-store" }
# The library engine (ADR 0153).
glue-engine = { path = "../../crates/glue-engine" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# A panic in the analysis of one broken file is caught and the song saved as failed (ADR 0147); with "abort" it ended
# GLUE Home, and the same file again at the next start.
panic = "unwind"
strip = true

# The audio maths at full speed; the rest of the app stays small.
[profile.release.package.glue-audio]
opt-level = 3
# The connections to other devices (ADR 0150): their encryption and transport at full speed too.
[profile.release.package.glue-rtc]
opt-level = 3
[profile.release.package.webrtc]
opt-level = 3
[profile.release.package.rtc]
opt-level = 3
[profile.release.package.rtc-sctp]
opt-level = 3
[profile.release.package.rtc-dtls]
opt-level = 3
[profile.release.package.rtc-srtp]
opt-level = 3
[profile.release.package.rtc-crypto]
opt-level = 3
[profile.release.package.rtc-ice]
opt-level = 3
[profile.release.package.rtc-datachannel]
opt-level = 3
[profile.release.package.rtc-stun]
opt-level = 3
[profile.release.package.rtc-turn]
opt-level = 3
