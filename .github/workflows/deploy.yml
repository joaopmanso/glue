name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The player's visualiser follows festanqueiro/threejs-visualisers' latest release (ADR 0068):
      # installed here when it's newer than the pin, so the checks, tests and build below use it.
      # visualisers.yml starts this workflow when a new release appears.
      - name: Latest threejs-visualisers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/festanqueiro/threejs-visualisers/releases/latest --jq .tag_name || true)
          pinned=$(node -p "require('./package.json').dependencies['threejs-visualisers'].split('#')[1]")
          echo "threejs-visualisers: pinned $pinned, latest ${latest:-unknown}"
          if [ -n "$latest" ] && [ "$latest" != "$pinned" ]; then npm install --no-save "github:festanqueiro/threejs-visualisers#$latest"; fi
          echo "${latest:-$pinned}" > visualisers.version
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: cp visualisers.version dist/visualisers.txt
      # The code map's interactive view (ADRs 0127-0129) at /glue/graph/: the latest graph.yml or a docs refresh
      # published on the branch graphify. graph.yml is quicker than the checks above, so it's usually this push's.
      - name: The code map's view
        run: |
          if git fetch --quiet origin graphify && git cat-file -e origin/graphify:graph.html; then
            mkdir -p dist/graph && git show origin/graphify:graph.html > dist/graph/index.html
          else
            echo "No code map view published yet"
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
