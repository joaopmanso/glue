name: Deploy GLUE Cloud

# The API Worker (ADR 0036): tests run in the main workflow (tests/cloud.test.ts); this one deploys.
on:
  push:
    branches: [main]
    paths: ['cloud/**', 'src/core/guide/state.ts', '.github/workflows/cloud.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npx vitest run tests/cloud.test.ts tests/home.test.ts
      # Until the D1 database exists (its id is in wrangler.toml), there's nothing to deploy to.
      - id: ready
        run: if grep -q TO_BE_CREATED cloud/wrangler.toml; then echo "::notice::D1 database not created yet; skipping the deploy"; echo "go=no" >> "$GITHUB_OUTPUT"; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ready.outputs.go == 'yes'
        working-directory: cloud
        run: npm ci --no-audit --no-fund
      - if: steps.ready.outputs.go == 'yes'
        working-directory: cloud
        run: npx wrangler d1 migrations apply glue --remote
      - if: steps.ready.outputs.go == 'yes'
        working-directory: cloud
        run: npx wrangler deploy
      # The relay's key (ADR 0081), once the owner has added it to the repository's secrets: handed to
      # the Worker as its secrets. Without them GLUE Cloud hands out no relay.
      - if: steps.ready.outputs.go == 'yes'
        working-directory: cloud
        env:
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
        run: |
          if [ -n "$TURN_KEY_ID" ] && [ -n "$TURN_KEY_API_TOKEN" ]; then
            printf '%s' "$TURN_KEY_ID" | npx wrangler secret put TURN_KEY_ID
            printf '%s' "$TURN_KEY_API_TOKEN" | npx wrangler secret put TURN_KEY_API_TOKEN
          else
            echo "::notice::No TURN key in the repository's secrets yet: GLUE Cloud hands out no relay"
          fi
      # The admin panel's free-tier usage (ADR 0093): a read-only Cloudflare token ("Account Analytics:
      # Read"), once the owner has added it; the account's id comes with it.
      - if: steps.ready.outputs.go == 'yes'
        working-directory: cloud
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: |
          if [ -n "$CF_ANALYTICS_TOKEN" ]; then
            printf '%s' "$CF_ANALYTICS_TOKEN" | npx wrangler secret put CF_ANALYTICS_TOKEN
            printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx wrangler secret put CF_ACCOUNT_ID
          else
            echo "::notice::No CF_ANALYTICS_TOKEN in the repository's secrets yet: the admin panel shows only the database's size"
          fi
