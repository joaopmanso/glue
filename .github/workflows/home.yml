name: GLUE Home

# Builds GLUE Home (home/, ADR 0044, 0045) for Windows and macOS on every push to main that touches it. When
# the version in home/src-tauri/tauri.conf.json has no release yet, the same build publishes it: the tag
# home-v<version>, the installers (the website's download links point at releases/latest), signed update
# files and latest.json for GLUE Home's own updater. One build per change (2026-09-30: a push and then a tag
# built everything twice, about 6 minutes each).
on:
  push:
    branches: [main]
    paths: ['home/**', 'crates/**', 'tests/golden/**', 'tests/fixtures/**', 'src/core/**', 'src/store/types.ts', 'src/ui/GlueStick.svelte', '.github/workflows/home.yml', 'package.json', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: write   # publish the release (a new version only)

concurrency:
  group: home-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    outputs:
      release: ${{ steps.rel.outputs.release }}
      tag: ${{ steps.rel.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            args: --bundles app,dmg --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: A new version? (then this build is its release)
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="home-v$(node -p "require('./home/src-tauri/tauri.conf.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then echo "release=false" >> "$GITHUB_OUTPUT"; else echo "release=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 'Rust targets (macOS: one app for Apple silicon and Intel)'
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm run home:ui
      # GLUE Home has no audio JavaScript (ADR 0147): its engine is Rust, so its pages ship no analysis worker.
      - name: No worker in GLUE Home's pages
        shell: bash
        run: if ls home/dist/assets | grep -i worker; then echo "GLUE Home's pages have a worker (ADR 0147)"; exit 1; fi
      # The Rust build cache: the dependencies (~400 crates) are compiled once, not on every run. Only
      # main's builds save it and read it (a new version's release is one of them).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            home/src-tauri -> target
            crates/glue-audio -> target
          shared-key: home-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # GLUE Home's Rust tests, on each system: some rules differ (a ':' in a file name is fine on macOS, ADR 0134).
      - name: Rust tests
        run: cargo test --manifest-path home/src-tauri/Cargo.toml
      # The native analysis engine (ADR 0147): its own tests, held to the website's results (tests/golden), and clippy.
      - name: Engine tests
        run: |
          cargo test --manifest-path crates/glue-audio/Cargo.toml
          cargo clippy --manifest-path crates/glue-audio/Cargo.toml --all-targets -- -D warnings
      - name: Build
        working-directory: home
        env:
          # Signs the update files; GLUE Home only installs updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build ${{ matrix.args }}
      - name: Collect the installer and the update files
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            d=home/src-tauri/target/release/bundle/nsis
            f=$(ls "$d"/*-setup.exe | head -1)
            cp "$f" out/GLUE-Home-Setup.exe
            cp "$f.sig" out/GLUE-Home-Setup.exe.sig
          else
            d=home/src-tauri/target/universal-apple-darwin/release/bundle
            cp "$(ls "$d"/dmg/*.dmg | head -1)" out/GLUE-Home.dmg
            cp "$(ls "$d"/macos/*.app.tar.gz | head -1)" out/GLUE-Home.app.tar.gz
            cp "$(ls "$d"/macos/*.app.tar.gz.sig | head -1)" out/GLUE-Home.app.tar.gz.sig
          fi
          ls -la out
      - name: Publish (a new version only)
        if: steps.rel.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.rel.outputs.tag }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "GLUE Home ${tag#home-v}" --notes-file home/RELEASE.md || true
          gh release upload "$tag" out/* --clobber

  # The updater's manifest: this version, and where each platform's signed update is.
  manifest:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ needs.build.outputs.tag }}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag"
          gh release download "$tag" -p '*.sig' -D sigs
          jq -n --arg v "${tag#home-v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg base "$base" \
            --rawfile w sigs/GLUE-Home-Setup.exe.sig --rawfile m sigs/GLUE-Home.app.tar.gz.sig \
            '{ version: $v, notes: "See the release on GitHub.", pub_date: $d, platforms: {
                "windows-x86_64": { signature: ($w | rtrimstr("\n")), url: ($base + "/GLUE-Home-Setup.exe") },
                "darwin-aarch64": { signature: ($m | rtrimstr("\n")), url: ($base + "/GLUE-Home.app.tar.gz") },
                "darwin-x86_64": { signature: ($m | rtrimstr("\n")), url: ($base + "/GLUE-Home.app.tar.gz") } } }' > latest.json
          cat latest.json
          gh release upload "$tag" latest.json --clobber
