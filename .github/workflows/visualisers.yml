# The player's visualiser follows festanqueiro/threejs-visualisers' latest release (ADR 0068).
# Every day: when the live site has an older release than the latest, deploy again (deploy.yml
# installs the latest one, then checks, tests, builds and publishes). Nothing is committed: only
# repository admins may update main.
name: Follow threejs-visualisers

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Compare the live site with the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/festanqueiro/threejs-visualisers/releases/latest --jq .tag_name)
          live=$(curl -fsS https://joaopmanso.github.io/glue/visualisers.txt || true)
          echo "threejs-visualisers: live ${live:-unknown}, latest $latest"
          if [ -n "$latest" ] && [ "$latest" != "$live" ]; then
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "Deploying $latest."
          fi
