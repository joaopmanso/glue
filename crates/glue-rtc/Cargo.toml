[package]
name = "glue-rtc"
version = "0.1.0"
edition = "2021"
description = "GLUE Home's connections to the account's other devices (ADR 0150): WebRTC data channels in Rust, the website's wire protocol"
license = "MIT"
publish = false

[dependencies]
webrtc = "=0.21.0"
# The protocol core webrtc builds on: named for its settings (the largest message, SctpMaxMessageSize).
rtc = "=0.21.0"
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
