[package]
name = "glue-audio"
version = "0.1.0"
edition = "2021"
description = "GLUE's audio analysis, native (ADR 0147): a line-for-line port of src/core's TypeScript, same results"
license = "UNLICENSED"
publish = false

[dependencies]
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
encoding_rs = "0.8"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"
lofty = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "alac", "isomp4", "ogg", "vorbis", "pcm", "wav", "aiff", "flac", "mkv"] }

[dev-dependencies]

# Tests run optimised: a debug FFT over a 192 kHz file is very slow.
[profile.test]
opt-level = 2
[profile.dev.package."*"]
opt-level = 3
