[package]
name = "glue-audio"
version = "0.1.0"
edition = "2021"
description = "GLUE's audio analysis, native (ADR 0147): a line-for-line port of src/core's TypeScript, same results"
license = "UNLICENSED"
publish = false

[dependencies]
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
encoding_rs = "0.8"
regex = { version = "1", default-features = false, features = ["std", "perf"] }

[dev-dependencies]
sha2 = "0.10"

# Tests run optimised: a debug FFT over a 192 kHz file is very slow.
[profile.test]
opt-level = 2
[profile.dev.package."*"]
opt-level = 3
