[package]
name = "glue-engine"
version = "0.1.0"
edition = "2021"
description = "GLUE Home's library engine (ADR 0153, 0154): the collections' stores, edits, the feed of changes, jobs and the analysis queue, in Rust"
license = "MIT"
publish = false

[dependencies]
glue-audio = { path = "../glue-audio" }
glue-store = { path = "../glue-store" }
glue-interop = { path = "../glue-interop" }
indexmap = "2"
# The cover look-up (covers.rs, names.rs): names compared as the website does.
regex = "1"
# A song's tags read without its audio (tags.rs, ADR 0157): GLUE Home's own reader, the analysis queue's first step.
lofty = "0.25"
unicode-normalization = "0.1"
# The shared sync (ADR 0155): packed texts, and the snapshot's hashes.
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# GLUE Home's service (ADR 0160): reminders count this computer's local days, as the website does.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[[bin]]
name = "glue-engine-test"
path = "src/bin/test.rs"

# The analysis is slow unoptimised: the tests (and the e2e tests' engine) build it optimised.
[profile.dev.package.glue-audio]
opt-level = 3
[profile.dev.package."*"]
opt-level = 2
